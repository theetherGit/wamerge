[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wamerge"
version = "0.1.0"
description = "Merge an Android WhatsApp text history into an iPhone's WhatsApp database (experimental)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pillow>=10"]

[project.optional-dependencies]
decrypt = ["wa-crypt-tools"]
test = ["pytest>=7"]

[project.scripts]
wamerge = "wamerge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
